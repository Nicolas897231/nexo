[project]
name = "nexovia-api"
version = "0.1.0"
description = "Backend FastAPI modular para NexoVia"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.1.0",
  "fastapi>=0.111.0",
  "gunicorn>=22.0.0",
  "psycopg[binary]>=3.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "PyJWT>=2.8.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "E501", "S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["S608"]

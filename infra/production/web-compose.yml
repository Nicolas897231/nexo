services:
  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_CLIENT_VERSION: 0.1.0
        API_INTERNAL_ORIGIN: http://10.10.10.240:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_CLIENT_VERSION: 0.1.0
      API_INTERNAL_ORIGIN: http://10.10.10.240:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
